# Telegram 频道分析平台 - Docker Compose (NAS 部署，纯定时报告)
# 使用方法: docker compose up -d

services:
  tg-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg-analyzer
    restart: unless-stopped
    # 使用宿主机网络：直连 NAS 本机 PostgreSQL(127.0.0.1:5433)
    network_mode: host
    environment:
      # 数据库（NAS 上已有的 PostgreSQL，host 网络下用 127.0.0.1）
      - DATABASE_URL=postgresql://postgres:cncncncn@127.0.0.1:5433/tg_bot
      # Telegram 账号
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_PHONE=${TELEGRAM_PHONE}
      - TELEGRAM_PASSWORD=${TELEGRAM_PASSWORD}
      # NAS 可直连 Telegram，无需代理
      - TELEGRAM_PROXY=${TELEGRAM_PROXY:-}
      # 大模型
      - OPENAI_BASE_URL=https://api.moco.fun/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=gemini-3.5-flash
      # 采集配置
      - WATCH_CHANNELS=@SZnewls
      - DISCUSSION_CHAT_ID=-1003367541028
      - SUMMARY_CHAT_ID=me
      - REPORT_TIME=23:59
      - MEDIA_DIR=/app/media
    volumes:
      # 媒体文件存储（图片/视频引用）
      - ./media:/app/media
      # Telegram 会话（避免重复登录）
      - ./telegram.session:/app/telegram.session
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
