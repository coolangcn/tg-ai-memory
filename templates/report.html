{% extends "base.html" %}

{% block content %}
<h2 class="mb-4">📈 生成高分老师精华报告</h2>

<div class="card mb-4">
    <div class="card-body">
        <form id="reportForm">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">最低评分</label>
                    <input type="number" class="form-control" id="minScore" value="9" min="1" max="10" step="0.5">
                </div>
                <div class="col-md-4">
                    <label class="form-label">分析帖子数</label>
                    <input type="number" class="form-control" id="limit" value="50" min="10" max="500">
                </div>
                <div class="col-md-4 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100" id="genBtn">生成报告</button>
                </div>
            </div>
        </form>
    </div>
</div>

<div id="reportResult" class="d-none">
    <div class="card">
        <div class="card-body">
            <h5>报告结果</h5>
            <div id="reportContent" class="mt-3" style="white-space: pre-wrap;"></div>
        </div>
    </div>
</div>

<div id="loading" class="text-center d-none">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-2">正在生成报告，请稍候...</p>
</div>

<script>
document.getElementById('reportForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('genBtn');
    const loading = document.getElementById('loading');
    const result = document.getElementById('reportResult');
    const content = document.getElementById('reportContent');

    btn.disabled = true;
    loading.classList.remove('d-none');
    result.classList.add('d-none');

    const formData = new FormData();
    formData.append('min_score', document.getElementById('minScore').value);
    formData.append('limit', document.getElementById('limit').value);

    try {
        const resp = await fetch('/api/report', { method: 'POST', body: formData });
        const data = await resp.json();
        content.textContent = data.report || '生成失败';
        result.classList.remove('d-none');
    } catch (err) {
        alert('生成失败: ' + err.message);
    } finally {
        btn.disabled = false;
        loading.classList.add('d-none');
    }
});
</script>
{% endblock %}
