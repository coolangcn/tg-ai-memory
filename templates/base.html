<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram 频道分析</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f5f5; }
        .sidebar { min-height: 100vh; background: #2c3e50; }
        .sidebar .nav-link { color: #ecf0f1; padding: 12px 20px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #34495e; color: #fff; }
        .stat-card { border-radius: 10px; padding: 20px; color: #fff; }
        .stat-card h3 { font-size: 2rem; margin: 0; }
        .post-card { border-radius: 10px; overflow: hidden; transition: transform 0.2s; }
        .post-card:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .post-media img, .post-media video { width: 100%; max-height: 300px; object-fit: cover; border-radius: 8px; }
        .comment-bubble { background: #f0f0f0; border-radius: 12px; padding: 10px 15px; margin-bottom: 8px; }
        .score-badge { font-size: 1.2rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <nav class="col-md-2 sidebar p-0">
                <div class="p-3 text-white">
                    <h5>📊 频道分析</h5>
                </div>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link" href="/">🏠 概览</a></li>
                    <li class="nav-item"><a class="nav-link" href="/posts">📋 帖子列表</a></li>
                    <li class="nav-item"><a class="nav-link" href="/report">📈 生成报告</a></li>
                </ul>
            </nav>

            <!-- 主内容 -->
            <main class="col-md-10 p-4">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
</body>
</html>
